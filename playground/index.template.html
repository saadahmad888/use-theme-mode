<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>use-theme-mode — local playground</title>

  <!--THEME_SCRIPT-->

  <style>
    :root[data-theme="light"] {
      --bg: #ffffff;
      --fg: #101014;
      --dim: #61616e;
      --line: #e3e3e8;
      --card: #f6f6f8;
      --accent: #3d3bd6;
    }

    :root[data-theme="dark"] {
      --bg: #0d0d10;
      --fg: #ececf1;
      --dim: #8a8a97;
      --line: #25252d;
      --card: #17171d;
      --accent: #9d8cff;
    }

    :root[data-theme="sepia"] {
      --bg: #f2e7d5;
      --fg: #3a2e1f;
      --dim: #7c6850;
      --line: #dfcfb4;
      --card: #faf2e4;
      --accent: #a8501c;
    }

    :root[data-theme="forest"] {
      --bg: #101d18;
      --fg: #e4efe8;
      --dim: #8fa89b;
      --line: #1e332a;
      --card: #16281f;
      --accent: #6ee7a8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 20px 64px;
      font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      transition: background-color .2s, color .2s;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      font-size: 21px;
      margin: 0 0 4px;
    }

    h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--dim);
      margin: 32px 0 10px;
      font-weight: 600;
    }

    p {
      margin: 0 0 12px;
      color: var(--dim);
    }

    code,
    pre {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 13px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      padding: 16px;
      transition: background-color .2s, border-color .2s;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 620px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    button {
      font: inherit;
      font-size: 13px;
      padding: 7px 13px;
      border-radius: 7px;
      cursor: pointer;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--fg);
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    button[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    dl {
      margin: 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 14px;
      font-family: ui-monospace, monospace;
      font-size: 13px;
    }

    dt {
      color: var(--dim);
    }

    dd {
      margin: 0;
      color: var(--accent);
      font-weight: 500;
    }

    ol {
      padding-left: 20px;
      color: var(--dim);
    }

    li {
      margin-bottom: 8px;
    }

    kbd {
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 12px;
      font-family: ui-monospace, monospace;
    }

    .pass {
      color: var(--accent);
      font-weight: 600;
    }
    a { 
      color: var(--accent); 
    }
    [data-no-react] { 
      color: var(--fg); 
    }
  </style>
</head>

<body>
  <noscript>
    <main>
      <h1>JavaScript is switched off</h1>
      <p>
        With JavaScript fully disabled the inline pre-paint script cannot run
        either, so no theme is applied and React never mounted. This is expected,
        and it is not a useful test.
      </p>
      <p>
        To check the no-flash script, turn JavaScript back on and open
        <code>/?no-react</code> instead.
      </p>
    </main>
  </noscript>
  <div id="root"></div>
  <script type="module" src="./app.js"></script>
</body>

</html>
